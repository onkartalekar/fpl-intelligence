name: Scheduled refresh

# Issue #101: triggers the shared dashboard's POST /api/refresh so the shared market data
# (prices, projections, fixture difficulty, official transfers, model performance) doesn't go
# stale between an operator's manual `curl` calls. Deliberately a separate workflow from
# deadline-reminder.yml: different purpose (freshening shared data, not emailing anyone) and a
# different cost profile (a refresh can take up to 5 minutes and calls live FPL/transfer-source
# APIs), so the two stay independently schedulable/disableable. See
# plans/issue-101-refresh-trigger.md for the full design, including why this lives on GitHub
# Actions rather than a Railway cron service.
#
# Issue #228: the refresh step now fires on EVERY hourly tick. It used to fire only inside four
# deadline-relative windows (T-2d, T-1d, T-12h, T-3h), which meant roughly four refreshes per
# gameweek, all clustered near the deadline, and nothing in between -- transfer news landing
# mid-week stayed invisible for days. Because the trigger no longer resolves a deadline, it no
# longer fetches the FPL bootstrap either; it needs nothing from Railway or the FPL API except
# the one POST /api/refresh call. GitHub's schedule cron is best-effort (documented delays of
# minutes, occasionally longer, under load), which an unconditional hourly trigger absorbs even
# more easily than the old window check did.
#
# Issue #102: also runs scripts/archive_team_forecasts.py on this same hourly tick, checked
# against its own independent set of checkpoints (T-24h/T-12h/T-3h) -- deliberately folded into
# this workflow rather than given its own schedule/workflow, per #102's own dependency note: it
# reuses this tick's cadence rather than introducing a second independent scheduler. Runs
# regardless of the refresh step's own outcome (`if: always()`) -- the two are unrelated actions
# with unrelated failure modes, and one failing must never silently skip the other.
#
# Issue #288 stopgap (option d): GitHub's schedule dispatch degraded to 3-6h gaps for over a week,
# which the archiver's own checkpoint windows (issue #286, first-tick-after-lead-time,
# first-write-wins) tolerate, but which still means market-data refreshes and archive attempts
# were only landing ~4-8 times a day instead of the intended ~24. Cron is widened to every 15
# minutes so a badly-delayed dispatch still ticks often enough to land inside each checkpoint
# window and keep refreshes closer to the intended cadence. This is a stopgap, not a fix for the
# dispatch delay itself -- see #288's option (a)/(c) for that.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: report whether a refresh would trigger, without calling /api/refresh (safe to run any time)."
        type: boolean
        default: true

# Both steps are already safe to run concurrently on their own (the refresh call is a plain
# idempotent POST, and the archiver is first-write-wins per checkpoint, issue #286) -- this exists
# to stop a burst of queued runs (the same catch-up-after-a-gap scenario #288 is mitigating) from
# piling up overlapping 5-minute runs and hammering the live FPL/transfer-source APIs
# simultaneously. `cancel-in-progress: false` queues a run behind one already in flight rather than
# dropping or cancelling it.
concurrency:
  group: scheduled-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger-refresh:
    runs-on: ubuntu-latest
    env:
      FPL_INTEL_REFRESH_TOKEN: ${{ secrets.FPL_INTEL_REFRESH_TOKEN }}
      FPL_INTEL_DASHBOARD_BASE_URL: ${{ secrets.FPL_INTEL_DASHBOARD_BASE_URL }}
    steps:
      - name: Print run configuration
        # Prints exactly what this run resolved to before doing anything else -- the trigger and
        # every workflow_dispatch input's actual value (unset on a `schedule` run, since
        # `inputs.*` only exists for workflow_dispatch).
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "dry_run: ${{ inputs.dry_run }}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check window and trigger refresh
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            DRY_RUN_FLAG=""
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN_FLAG="--dry-run"
          else
            DRY_RUN_FLAG=""
          fi
          PYTHONPATH=src python3 scripts/trigger_scheduled_refresh.py $DRY_RUN_FLAG

      - name: Check windows and archive per-team forecasts (issue #102)
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            DRY_RUN_FLAG=""
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN_FLAG="--dry-run"
          else
            DRY_RUN_FLAG=""
          fi
          PYTHONPATH=src python3 scripts/archive_team_forecasts.py $DRY_RUN_FLAG
