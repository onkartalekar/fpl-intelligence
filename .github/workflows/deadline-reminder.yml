name: Deadline reminder

# Issue #55: emails a transfer-deadline reminder with current recommendations, a configurable
# number of hours before each gameweek's deadline (default 3h, per-team via
# FPL_INTEL_REMINDER_TEAMS). See plans/issue-55-deadline-email-reminder.md for the full design --
# this workflow is deliberately a thin, trigger-agnostic wrapper around
# scripts/send_deadline_reminder.py, which does all the real work and takes no opinion on what
# invokes it (this workflow today; a future #27 host's own scheduler unchanged, later).
#
# GitHub's schedule cron is best-effort (documented delays of minutes, occasionally longer, under
# load); the hourly cadence against a >=3h lead was meant to comfortably absorb that.
#
# Issue #288 stopgap (option d): GitHub's schedule dispatch degraded to 3-6h gaps for over a week
# (confirmed via `gh run list`), well past what an hourly tick can absorb against
# `in_send_window`'s one-hour-wide band -- a gameweek's checkpoint could land entirely inside a
# gap and get no tick at all, silently skipping the reminder. Cron is widened to every 15 minutes
# so a badly-delayed dispatch still lands a tick inside a still-open window far more often. This
# is a stopgap, not a fix for the dispatch delay itself -- see #288's option (a)/(c) for that.
# Because a *healthy* 15-minute cron can now land several ticks inside one still-open window,
# `FPL_INTEL_REMINDER_SENT_STATE` below (read before the run, written back after a real send) is
# what keeps that from re-sending the same reminder on every one of those ticks.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print composed email(s) instead of sending (safe to run any time)."
        type: boolean
        default: true

# Issue #288 stopgap: with cron every 15 minutes, GitHub can dispatch a burst of queued runs
# back-to-back once a delayed schedule catches up (the exact scenario that motivated widening the
# cron in the first place). Without this, two runs could both read REMINDER_SENT_STATE before
# either writes it back, both conclude "not yet sent," and both send -- a race the dedup marker
# alone can't close. `cancel-in-progress: false` queues a second run behind the first instead of
# overlapping (or cancelling it, which would risk cancelling mid-send); it never drops a run.
concurrency:
  group: deadline-reminder
  cancel-in-progress: false

permissions:
  contents: read
  # actions: write is used for both reading and writing the dedup-state variable (gh variable
  # get/set) below -- GitHub's Actions permission scopes only have none/read/write levels, and
  # write already implies read.
  actions: write

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    env:
      FPL_INTEL_REMINDER_TEAMS: ${{ secrets.FPL_INTEL_REMINDER_TEAMS }}
      FPL_INTEL_SMTP_HOST: ${{ secrets.FPL_INTEL_SMTP_HOST }}
      FPL_INTEL_SMTP_PORT: ${{ secrets.FPL_INTEL_SMTP_PORT }}
      FPL_INTEL_SMTP_USER: ${{ secrets.FPL_INTEL_SMTP_USER }}
      FPL_INTEL_SMTP_PASSWORD: ${{ secrets.FPL_INTEL_SMTP_PASSWORD }}
      # Issue #125: recommendations are now fetched live from the hosted dashboard's
      # /api/manager-view and /api/shared-state, instead of computed locally from files this
      # runner never had access to -- same two secrets scheduled-refresh.yml already uses.
      FPL_INTEL_DASHBOARD_BASE_URL: ${{ secrets.FPL_INTEL_DASHBOARD_BASE_URL }}
      FPL_INTEL_REFRESH_TOKEN: ${{ secrets.FPL_INTEL_REFRESH_TOKEN }}
      # Issue #105: opt-in profiles.db-sourced roster, fetched live from /api/reminder-teams --
      # both secrets default to unset/blank until an operator provisions them, which
      # collect_teams treats as "disabled," exactly as it always has for this env var.
      FPL_INTEL_REMINDER_PROFILES_DB: ${{ secrets.FPL_INTEL_REMINDER_PROFILES_DB }}
      FPL_INTEL_REMINDER_TEAMS_TOKEN: ${{ secrets.FPL_INTEL_REMINDER_TEAMS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Print run configuration
        # Prints exactly what this run resolved to before doing anything else -- the trigger and
        # every workflow_dispatch input's actual value (unset on a `schedule` run, since
        # `inputs.*` only exists for workflow_dispatch). No secrets, no recipient data here --
        # just the boolean selection itself, safe for this repo's public run logs.
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "dry_run: ${{ inputs.dry_run }}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Read reminder dedup state (issue #288 stopgap)
        # Best-effort by design (matches send_deadline_reminder.py's own parse_sent_state): a
        # missing/unreadable variable (e.g. the very first run ever, before anything has been
        # written) just means "no prior send known," not a failure -- `continue-on-error` plus the
        # `|| true` fallback below both exist so this step can never fail the job.
        id: sent_state
        continue-on-error: true
        run: |
          VALUE=$(gh variable get REMINDER_SENT_STATE --json value -q .value 2>/dev/null || true)
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        # Issue #240: send_deadline_reminder.py now imports notifications/pitch_image.py (to
        # build the reminder email's Starting XI image URL), which imports Pillow -- this
        # workflow's first real third-party dependency (numpy, requirements.txt's other entry, is
        # only ever imported by offline scripts this workflow never runs). Without this step the
        # run below fails with `ModuleNotFoundError: No module named 'PIL'`, exactly as
        # tests.yml's matrix did before it got the same fix.
        run: pip install -r requirements.txt

      # Public-repo log hygiene (see plans/issue-55-deadline-email-reminder.md): the script itself
      # already never prints recipient emails or SMTP credentials in normal operation, but
      # --dry-run's entire purpose is showing a human the composed email, which *does* include the
      # recipient address and full body. Since this repo's workflow run logs are publicly visible,
      # that full output is redirected to a file and never echoed to the log -- only the script's
      # own final one-line summary ("checked: outside window" / "reminder sent for GW<N> to
      # N team(s)") is printed. The full file is kept only as a short-lived build artifact for
      # local/manual debugging of a workflow_dispatch dry run, not printed inline.
      - name: Run deadline reminder
        id: reminder
        env:
          # Issue #288 stopgap: fed straight from the previous step's read, unmerged -- the script
          # itself (parse_sent_state) is what tolerates it being blank/malformed.
          FPL_INTEL_REMINDER_SENT_STATE: ${{ steps.sent_state.outputs.value }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            DRY_RUN_FLAG=""
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN_FLAG="--dry-run"
          else
            DRY_RUN_FLAG=""
          fi
          PYTHONPATH=src python3 scripts/send_deadline_reminder.py $DRY_RUN_FLAG > reminder-output.log 2>&1
          status=$?
          echo "----- reminder run summary (full output, including any --dry-run email bodies, kept out of the public log; see the uploaded artifact) -----"
          tail -n 1 reminder-output.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload full run output (debug artifact, not printed to the log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reminder-output-${{ github.run_id }}
          path: reminder-output.log
          retention-days: 7

      # Issue #288 stopgap: this is now the *only* dedup layer that matters once cron ticks every
      # 15 minutes instead of hourly -- `in_send_window`'s one-hour-wide band can no longer be
      # trusted to see at most one tick on its own (that assumption is exactly what #288 found
      # broken the other direction: too few ticks, not too many). The script prints the full new
      # state (this run's sends already merged with whatever this step last wrote) on a single
      # `reminder_sent_state: {...}` line, so this step only has to capture and store it verbatim
      # -- no JSON handling here. Still best-effort/non-blocking: if this write fails (e.g.
      # `actions: write` turns out insufficient), the next successful write catches up, and the
      # cost of a missed write is only a duplicate email inside the current still-open window, not
      # a missed one. Only runs after a real (non-dry-run) scheduled send actually happened.
      - name: Record sent checkpoints (best-effort dedup marker)
        if: always() && steps.reminder.outputs.exit_code == '0' && github.event_name == 'schedule'
        continue-on-error: true
        run: |
          NEW_STATE=$(sed -n 's/^reminder_sent_state: //p' reminder-output.log | tail -n 1)
          if [ -n "$NEW_STATE" ]; then
            gh variable set REMINDER_SENT_STATE --body "$NEW_STATE"
          fi
