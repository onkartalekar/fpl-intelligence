name: Release notes

# Issue #143: publishes the "What's New" dashboard tab's daily entry -- see
# plans/issue-143-whats-new-tab.md for the full design. Thin wrapper around
# scripts/publish_release_notes.py, which does all the real work (listing yesterday's merged
# PRs, generating the entry, publishing it) and takes no opinion on what invokes it.
#
# Two cron triggers, not one: GitHub's schedule cron is fixed UTC and does not itself understand
# "8 AM Eastern Time" -- a single hardcoded UTC time would silently drift by an hour whenever the
# US crosses a DST boundary. 12:00 UTC covers 8 AM EDT, 13:00 UTC covers 8 AM EST; the script's
# own is_correct_scheduled_trigger() no-ops whichever trigger doesn't match the current DST
# regime, so exactly one of these two runs actually publishes on any given day -- the "wrong" one
# exiting quietly is expected, not a failure.
#
# Bug fix: that check used to compare actual wall-clock time against a fixed target hour, which
# broke silently once GitHub Actions' scheduled-trigger delay (routine, sometimes an hour or
# more) pushed a run's real start past that hour -- both daily triggers then reported "outside
# the window" and no-op'd, every day, with no error (confirmed live: nothing published between
# 2026-08-11 and this fix, despite every run succeeding). Passing github.event.schedule -- the
# exact cron string GitHub Actions says fired this run -- lets the script check "is this the cron
# that's correct for today's actual DST regime" instead, which stays correct no matter how late
# the run actually started.

on:
  schedule:
    - cron: "0 12 * * *"  # 8 AM EDT
    - cron: "0 13 * * *"  # 8 AM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the generated entry instead of publishing/writing it. Ignored entirely in backfill mode (see backfill_start) -- that mode has its own explicit backfill_publish switch instead."
        type: boolean
        default: true
      skip_hour_check:
        description: "Run right now, regardless of time of day. The daily schedule only fires around 8am ET; leave this on for manual runs so it doesn't get skipped. (Backfill mode always runs immediately, this has no effect there.)"
        type: boolean
        default: true
      backfill_start:
        description: "Regenerate past days instead of today: first date to start from (YYYY-MM-DD). Leave blank for a normal single-day run."
        type: string
        default: ""
      backfill_end:
        description: "Only used with 'Backfill from date' above: last date to regenerate (YYYY-MM-DD). Leave blank to stop at yesterday."
        type: string
        default: ""
      backfill_publish:
        description: "Only used with 'Backfill from date' above: also push each regenerated day live to the dashboard, not just the archived file. Leave off to only update the archive."
        type: boolean
        default: false

permissions:
  contents: write  # Issue #143's Candidate C3: this workflow commits release-notes/<date>.md --
                    # the first scheduled job in this repo with write access to the repo itself
                    # (every other one is contents: read; see the plan doc's Structural
                    # constraints section for why that's a deliberate, confirmed exception here).
  pull-requests: write  # This repo's main branch ruleset requires every change go through a PR
                         # (confirmed live: a direct push here was rejected with "GH013 ... Changes
                         # must be made through a pull request"), even though the ruleset itself
                         # requires zero approvals -- so contents: write alone was never going to
                         # be enough. This workflow opens a PR for its own archival commit and
                         # enables auto-merge on it (see "Commit the archived entry"'s own comment
                         # for why that's `--auto`, not an immediate synchronous merge).

jobs:
  publish-release-notes:
    runs-on: ubuntu-latest
    env:
      FPL_INTEL_DASHBOARD_BASE_URL: ${{ secrets.FPL_INTEL_DASHBOARD_BASE_URL }}
      FPL_INTEL_REFRESH_TOKEN: ${{ secrets.FPL_INTEL_REFRESH_TOKEN }}
      # Optional -- unset means the script falls back to a plain template entry (no LLM styling)
      # rather than failing. Deliberately a separate credential from news_signals.py's
      # FPL_INTEL_LLM_* (confirmed with the user 2026-08-11: nothing is shared with the dormant
      # Phase 5 feature).
      FPL_INTEL_RELEASE_NOTES_LLM_PROVIDER: ${{ secrets.FPL_INTEL_RELEASE_NOTES_LLM_PROVIDER }}
      FPL_INTEL_RELEASE_NOTES_LLM_MODEL: ${{ secrets.FPL_INTEL_RELEASE_NOTES_LLM_MODEL }}
      FPL_INTEL_RELEASE_NOTES_LLM_API_KEY: ${{ secrets.FPL_INTEL_RELEASE_NOTES_LLM_API_KEY }}
      FPL_INTEL_RELEASE_NOTES_LLM_API_BASE: ${{ secrets.FPL_INTEL_RELEASE_NOTES_LLM_API_BASE }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Print run configuration
        # Prints exactly what this run resolved to before doing anything else -- the trigger,
        # and every workflow_dispatch input's actual value (unset/default on a `schedule` run,
        # since `inputs.*` only exists for workflow_dispatch). Confirmed live: without this, a
        # manual run's actual selections (e.g. backfill_publish left unchecked) were buried
        # inside a later step's shell-flag-building trace, not visible without reading the full
        # log -- this makes them the first thing anyone sees.
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "schedule (cron that fired, schedule runs only): ${{ github.event.schedule }}"
          echo "dry_run: ${{ inputs.dry_run }}"
          echo "skip_hour_check: ${{ inputs.skip_hour_check }}"
          echo "backfill_start: ${{ inputs.backfill_start }}"
          echo "backfill_end: ${{ inputs.backfill_end }}"
          echo "backfill_publish: ${{ inputs.backfill_publish }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate and publish
        run: |
          set +e
          FLAGS=""
          if [ -n "${{ inputs.backfill_start }}" ]; then
            # Backfill mode is a distinct code path in the script (bypasses --dry-run and the
            # hour/DST gate entirely, per its own docstring) -- dry_run/skip_hour_check are
            # meaningless here, backfill_publish is the only switch that matters.
            FLAGS="$FLAGS --backfill-start ${{ inputs.backfill_start }}"
            if [ -n "${{ inputs.backfill_end }}" ]; then
              FLAGS="$FLAGS --backfill-end ${{ inputs.backfill_end }}"
            fi
            if [ "${{ inputs.backfill_publish }}" = "true" ]; then
              FLAGS="$FLAGS --backfill-publish"
            fi
          else
            # Bug fix: the old condition was `!= workflow_dispatch OR dry_run == true`, which added
            # --dry-run on every `schedule` trigger unconditionally (the workflow_dispatch `dry_run`
            # input doesn't exist on schedule events, but the `!=` half of the OR was already true by
            # itself) -- confirmed live: every daily cron run since this workflow's inception
            # generated the entry, printed it, and never called publish_entry/write_archive_file,
            # while still exiting 0. Only a manual workflow_dispatch run with the dry_run checkbox
            # checked (the default) should dry-run; the daily schedule must always publish for real.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
              FLAGS="$FLAGS --dry-run"
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_hour_check }}" = "true" ]; then
              FLAGS="$FLAGS --skip-hour-check"
            fi
          fi
          PYTHONPATH=src python3 scripts/publish_release_notes.py $FLAGS --schedule "${{ github.event.schedule }}"
          exit $?

      - name: Ensure a valid CA bundle before pushing
        # Defensive: a live run of this workflow failed here with "server certificate
        # verification failed. CAfile: none CRLfile: none" on `git push`, even though the
        # earlier Checkout step's own HTTPS clone succeeded moments before in the same job --
        # so the runner's CA store was fine at checkout time, and something (most likely a
        # transient runner-image issue; documented as an occasional flake on GitHub-hosted
        # runners) left it unusable by the time this step ran. Explicitly reinstalling
        # ca-certificates and pointing git at the resulting bundle is the standard mitigation --
        # it doesn't weaken verification (no sslVerify=false anywhere), just guarantees a real
        # bundle is present.
        if: github.event_name == 'schedule' || inputs.dry_run == false || inputs.backfill_start != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --reinstall ca-certificates
          sudo update-ca-certificates
          git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt

      - name: Commit the archived entry via a PR, if one was written
        # Only real (non-dry-run) runs write release-notes/<date>.md at all; `git status
        # --porcelain` is empty on a --dry-run run or a genuine no-op day (nothing merged), so
        # this step is a safe no-op in both those cases, not a failure.
        #
        # A branch + PR + auto-merge, not a direct push to main: this repo's branch ruleset
        # requires every change go through a PR (confirmed live -- a bare `git push` here was
        # rejected with "GH013 ... Changes must be made through a pull request"). The ruleset
        # itself requires zero approvals, matching the "just publishes, no review gate" design
        # this workflow was always meant to have (see plans/issue-143-whats-new-tab.md's
        # Structural constraints section) -- but a *separate* classic branch-protection rule on
        # `main` (distinct from that ruleset) requires the 4 "Run test suite (...)" checks to
        # pass before any merge. Bug fix, confirmed live: an earlier version of this step called
        # `gh pr merge --squash --delete-branch` with no `--auto`, which tried to merge
        # synchronously seconds after the PR was created -- long before those checks (each
        # several minutes) could possibly report -- and failed outright ("the base branch policy
        # prohibits the merge"), leaving a dangling unmerged PR every time there was real content
        # to archive. `--auto` enables auto-merge instead: GitHub merges it itself once the
        # required checks pass, no synchronous wait needed here.
        #
        # gh pr create/merge specifically need FPL_INTEL_RELEASE_NOTES_PAT, not the default
        # github.token: confirmed live -- "GitHub Actions is not permitted to create or approve
        # pull requests" is a separate, repo-wide restriction on the GITHUB_TOKEN identity,
        # distinct from (and additional to) the branch ruleset's own PR requirement above. A
        # fine-grained PAT (repo-scoped, Contents + Pull requests: Read and write) authenticates
        # as the user instead, which isn't subject to that restriction. The `git push` two lines
        # below doesn't need it -- that already works fine with the default token, confirmed live
        # (only PR creation was ever the blocked step).
        #
        # Branch name includes github.run_id: confirmed live -- a date-only branch name
        # (release-notes-archive-<date>) collided with a leftover branch from an earlier run that
        # had failed *after* pushing but *before* merging (the PR-creation-permission failure this
        # same step's PAT fix above addresses). That stale branch then blocked every subsequent
        # day's run with "! [rejected] ... (fetch first)" until manually deleted. A per-run-unique
        # branch name means a half-finished prior run can never collide with the next one again --
        # the branch is either deleted by --delete-branch on success, or left behind harmlessly
        # under its own unique name if a run fails, never reused.
        if: github.event_name == 'schedule' || inputs.dry_run == false || inputs.backfill_start != ''
        env:
          GH_TOKEN: ${{ secrets.FPL_INTEL_RELEASE_NOTES_PAT }}
        run: |
          if [ -n "$(git status --porcelain release-notes/)" ]; then
            DATE=$(date -u +%Y-%m-%d)
            BRANCH="release-notes-archive-$DATE-${{ github.run_id }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add release-notes/
            git commit -m "Archive $DATE release notes (automated, issue #143)"
            git push -u origin "$BRANCH"
            gh pr create --title "Archive $DATE release notes" \
              --body "Automated archival commit from release-notes.yml -- issue #143." \
              --base main --head "$BRANCH"
            gh pr merge "$BRANCH" --squash --delete-branch --auto
          else
            echo "Nothing new to archive."
          fi
