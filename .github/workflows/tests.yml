name: Tests

# Issue #170: this is the first CI workflow in the repo that actually runs the offline unit suite
# in tests/ -- the four other workflows here (deadline-reminder, release-notes,
# scheduled-refresh, live-regression-check) are all trigger=schedule/workflow_dispatch only, and
# none of them invoke unittest/pytest. Before this, tests/*.py only ran when a human happened to
# run it locally, on whatever Python version their machine had -- which is exactly how a
# version-dependent bug (socket.timeout vs. TimeoutError, only distinct on Python < 3.10) went
# undetected until it broke locally on a 3.9 dev sandbox despite the repo's own scheduled
# workflows and deploy target both being 3.11.
#
# Python 3.11 only, matching the version already pinned by every other workflow in this repo
# (and presumably Railway's deploy target) -- the repo declares no other supported version
# anywhere (no runtime.txt, no python_requires), so testing an undeclared version here would be
# scope beyond "add CI."
#
# Split into a 4-way matrix rather than one `unittest discover` job: measured locally, 5 of the
# 32 test modules account for ~99% of the suite's wall time (test_transfer_decisions.py alone is
# ~283s / 24 tests -- ~12s/test, apparently real combinatorial cost in the transfer-decision
# engine, not a test-harness artifact; test_server.py, test_send_deadline_reminder.py,
# test_refresh.py, and test_recommendations.py are the other four). The other 27 modules combined
# run in about a second. A single serial job pays the full ~730s sum (and took ~19min on GitHub's
# shared runners, slower than the ~12min measured locally); grouping the heavy modules into their
# own parallel jobs bounds wall time by the slowest *group* instead. Groups are sized off that
# measurement, not file count -- rebalance them if `tests/` timing shifts enough to make one
# group the new outlier.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  run-tests:
    # Explicit name pinned to just matrix.group: left to its default, GitHub concatenates every
    # matrix key/value into the check-run name and truncates at 100 chars, which made the
    # everything-else group's context end in a literal "..." -- fragile to depend on for branch
    # protection's required-checks list. Naming it explicitly keeps the four check names short,
    # clean, and stable regardless of how long any group's module list gets.
    name: Run test suite (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: transfer-decisions
            modules: tests.test_transfer_decisions
          - group: server-and-recommendations
            modules: tests.test_server tests.test_recommendations
          - group: refresh-and-reminders
            modules: tests.test_refresh tests.test_send_deadline_reminder
          - group: everything-else
            modules: >-
              tests.test_archive_team_forecasts tests.test_backtest tests.test_catalog
              tests.test_coefficients tests.test_dashboard tests.test_deadline_windows
              tests.test_fpl_data tests.test_live_regression_check tests.test_manager_data
              tests.test_minutes tests.test_ml_minutes tests.test_model_performance
              tests.test_news_signals tests.test_pl_transfers tests.test_profiles tests.test_projection
              tests.test_publish_release_notes tests.test_rate_limit tests.test_refresh_safety
              tests.test_release_notes tests.test_release_notes_email tests.test_release_notes_subscribers tests.test_relevance
              tests.test_reminder_confirmation tests.test_start_dashboard tests.test_team_strength
              tests.test_transfers tests.test_trigger_scheduled_refresh
    steps:
      - name: Print run configuration
        # No workflow_dispatch inputs here (pull_request/push only), but the matrix "selection"
        # this specific job got is worth printing up front too -- which group, and exactly which
        # modules it resolved to run.
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "matrix.group: ${{ matrix.group }}"
          echo "matrix.modules: ${{ matrix.modules }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect docs-only changes
        # A PR touching only non-code paths -- release-notes.yml's daily archival commit
        # (release-notes/<date>.md, generated, never code), planning docs (plans/**, including
        # their checked-in assets like plans/assets/*.html mockups), and the top-level
        # architecture/spec docs -- can't be caught by this matrix, so waiting several minutes on
        # it doesn't buy anything (confirmed live 2026-08-16: it's also why release-notes.yml's
        # `gh pr merge --auto` had to sit and wait rather than complete near-instantly). Skip the
        # actual test run for that case below -- but only the *steps*, never this job itself:
        # branch protection's required-status-checks list this job's name by exact context
        # ("Run test suite (...)" -- confirmed via `gh api .../branches/main/protection`), and a
        # job that never runs at all (a job-level `if:` skipping the whole thing) leaves that
        # named check permanently "expected, never reported," which blocks merging forever -- a
        # well-known GitHub Actions gotcha, not a hypothetical. A job that runs but skips its
        # inner steps still reports a real success/failure conclusion, so this satisfies the
        # required check either way, on both this event type and every other kind of PR.
        #
        # Deliberately an explicit allowlist of exact doc paths, not a broad "*.md anywhere"
        # rule: config/*.json is real runtime config tests assert against, demo-video/ contains
        # record_demo.py (a real script, not just docs), and .github/ is this very CI config --
        # none of those are safe to wave through unread, even though some sit next to genuinely
        # inert files. Extend this list deliberately, file by file/directory, not by loosening
        # the pattern.
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          # Bug fix, confirmed live: actions/checkout@v4's default shallow checkout for a
          # pull_request event leaves only the synthetic merge commit locally -- base.sha alone
          # (fetched below) isn't enough, head.sha itself isn't a reachable object either, so a
          # diff between them failed outright with "fatal: bad object <head sha>". Fetching both
          # SHAs explicitly (each --depth=1, so this stays cheap) makes both diff endpoints real,
          # present objects.
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          echo "changed files:"
          echo "$changed_files"
          docs_only_pattern='^(release-notes/|plans/|ARCHITECTURE\.md$|IMPLEMENTATION_PLAN\.md$|MODEL\.md$|README\.md$|SPECIFICATION\.md$)'
          if [ -n "$changed_files" ] && [ -z "$(echo "$changed_files" | grep -Ev "$docs_only_pattern")" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite
        if: steps.scope.outputs.skip != 'true'
        run: PYTHONPATH=src python3 -m unittest ${{ matrix.modules }} -v

      - name: Skipped -- docs-only change
        if: steps.scope.outputs.skip == 'true'
        run: |
          echo "Skipping the test suite: every changed file in this PR is a non-code doc (release-notes/, plans/, or a top-level architecture/spec doc)."
