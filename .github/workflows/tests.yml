name: Tests

# Issue #170: this is the first CI workflow in the repo that actually runs the offline unit suite
# in tests/ -- the four other workflows here (deadline-reminder, release-notes,
# scheduled-refresh, live-regression-check) are all trigger=schedule/workflow_dispatch only, and
# none of them invoke unittest/pytest. Before this, tests/*.py only ran when a human happened to
# run it locally, on whatever Python version their machine had -- which is exactly how a
# version-dependent bug (socket.timeout vs. TimeoutError, only distinct on Python < 3.10) went
# undetected until it broke locally on a 3.9 dev sandbox despite the repo's own scheduled
# workflows and deploy target both being 3.11.
#
# Python 3.11 only, matching the version already pinned by every other workflow in this repo
# (and presumably Railway's deploy target) -- the repo declares no other supported version
# anywhere (no runtime.txt, no python_requires), so testing an undeclared version here would be
# scope beyond "add CI."
#
# Split into a 4-way matrix rather than one `unittest discover` job: measured locally, 5 of the
# 32 test modules account for ~99% of the suite's wall time (test_transfer_decisions.py alone is
# ~283s / 24 tests -- ~12s/test, apparently real combinatorial cost in the transfer-decision
# engine, not a test-harness artifact; test_server.py, test_send_deadline_reminder.py,
# test_refresh.py, and test_recommendations.py are the other four). The other 27 modules combined
# run in about a second. A single serial job pays the full ~730s sum (and took ~19min on GitHub's
# shared runners, slower than the ~12min measured locally); grouping the heavy modules into their
# own parallel jobs bounds wall time by the slowest *group* instead. Groups are sized off that
# measurement, not file count -- rebalance them if `tests/` timing shifts enough to make one
# group the new outlier.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  run-tests:
    name: Run test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: transfer-decisions
            modules: tests.test_transfer_decisions
          - group: server-and-recommendations
            modules: tests.test_server tests.test_recommendations
          - group: refresh-and-reminders
            modules: tests.test_refresh tests.test_send_deadline_reminder
          - group: everything-else
            modules: >-
              tests.test_archive_team_forecasts tests.test_backtest tests.test_catalog
              tests.test_coefficients tests.test_dashboard tests.test_deadline_windows
              tests.test_fpl_data tests.test_live_regression_check tests.test_manager_data
              tests.test_minutes tests.test_ml_minutes tests.test_model_performance
              tests.test_news_signals tests.test_pl_transfers tests.test_profiles tests.test_projection
              tests.test_publish_release_notes tests.test_rate_limit tests.test_refresh_safety
              tests.test_release_notes tests.test_release_notes_subscribers tests.test_relevance
              tests.test_reminder_confirmation tests.test_start_dashboard tests.test_team_strength
              tests.test_transfers tests.test_trigger_scheduled_refresh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite
        run: PYTHONPATH=src python3 -m unittest ${{ matrix.modules }} -v
